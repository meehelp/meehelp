name: Website V2 release checks

on:
  push:
    branches:
      - seo/phase-4-content-preview
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Full checks
        run: npm run check
      - name: Production build
        run: npm run build:production
      - name: Zero-JS check
        run: |
          count=$(find dist -type f -name '*.js' | wc -l | tr -d ' ')
          echo "JavaScript files in dist: $count"
          test "$count" = "0"
